<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SlideBranch · 演示稿工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,600&display=swap">
    <link rel="stylesheet" href="/app.css">
    <script src="/theme.js"></script>
    <script src="/app.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a href="#/" id="home-link" class="brand" title="返回首页">
            <span class="brand-mark" aria-hidden="true" data-icon="branch"></span>
            <span class="brand-name">SlideBranch</span>
        </a>
        <span class="topbar-divider deck-only" aria-hidden="true"></span>
        <a href="#/" class="ghost-link deck-only" title="返回首页"><span data-icon="home"></span><span class="label">首页</span></a>
        <div class="deck-nav deck-only">
            <span class="deck-nav-icon" aria-hidden="true" data-icon="deck"></span>
            <span id="deck-title" class="deck-title"></span>
        </div>
        <button id="style-button" class="ghost deck-only" disabled title="项目风格"><span data-icon="palette"></span><span class="label">项目风格</span></button>
        <button id="library-button" class="ghost deck-only" disabled title="素材库" aria-pressed="false" aria-controls="library"><span data-icon="image"></span><span class="label">素材库</span></button>
        <span class="topbar-spacer"></span>
        <span id="deck-cost" class="deck-cost deck-only"></span>
        <span id="mode" class="mode"></span>
        <button id="settings-button" class="ghost" type="button" aria-label="本机设置" title="本机设置"><span data-icon="settings"></span><span class="label">设置</span></button>
        <button id="theme-button" class="ghost theme-button" type="button"><span data-icon="theme"></span><span id="theme-label" class="label"></span></button>
        <button id="exports-button" class="primary deck-only" disabled><span data-icon="download"></span><span class="label">导出</span></button>
    </header>
    <main id="home" class="home" hidden>
        <div class="home-inner">
            <div class="home-head">
                <h1>演示稿工作台</h1>
                <p class="muted">每页一张整图。写下文字生成图片，再用一句话修改。</p>
            </div>
            <div class="home-actions">
                <button id="home-new" type="button" class="home-action accent">
                    <span class="home-action-icon" data-icon="plus"></span>
                    <span class="home-action-text"><strong>新增项目</strong><small>从空白演示稿开始</small></span>
                </button>
                <button id="home-settings" type="button" class="home-action">
                    <span class="home-action-icon" data-icon="settings"></span>
                    <span class="home-action-text"><strong>设置</strong><small>密钥、绘图模型和图片尺寸</small></span>
                </button>
            </div>
            <div class="panel-header home-section">
                <h2>历史项目 <span id="deck-count" class="count"></span></h2>
            </div>
            <div id="deck-grid" class="deck-grid"></div>
        </div>
    </main>
    <main id="workspace" class="workspace" hidden>
        <aside class="sidebar" aria-label="页面列表">
            <div class="panel-header">
                <h2>页面 <span id="slide-count" class="count"></span></h2>
                <button id="add-slide" class="icon" aria-label="添加页面" title="添加页面" disabled><span data-icon="plus"></span></button>
            </div>
            <div id="slides" class="slides"></div>
            <button id="trash-button" class="trash-button ghost" disabled><span data-icon="trash"></span><span id="trash-label">回收站</span></button>
        </aside>
        <aside id="library" class="library" aria-label="素材库" hidden>
            <div class="panel-header">
                <h2>素材库 <span id="library-count" class="count"></span></h2>
                <span class="library-head-actions">
                    <button id="library-add" class="ghost" type="button"><span data-icon="upload"></span><span>上传</span></button>
                    <button id="library-close" class="icon" type="button" aria-label="关闭素材库" title="关闭素材库"><span data-icon="close"></span></button>
                </span>
            </div>
            <input id="library-input" type="file" accept="image/png,image/jpeg" hidden>
            <form id="library-upload" class="library-upload" hidden>
                <p id="library-file" class="muted"></p>
                <div class="field">
                    <label for="library-name">名称</label>
                    <input id="library-name" maxlength="100" required>
                </div>
                <div class="field">
                    <label for="library-tags">标签</label>
                    <input id="library-tags" maxlength="900" placeholder="用逗号分隔，例如：品牌, Logo">
                </div>
                <div class="dialog-actions">
                    <button type="button" id="library-cancel" class="ghost">取消</button>
                    <button type="submit" class="primary">上传素材</button>
                </div>
            </form>
            <input id="library-search" type="search" maxlength="100" placeholder="按名称搜索" aria-label="按名称搜索素材">
            <div id="library-filter" class="tag-filter" aria-label="按标签筛选"></div>
            <p class="muted library-hint">把素材拖到左侧某一页，加入该页的候选图。</p>
            <div id="library-list" class="library-list"></div>
        </aside>
        <section class="stage" aria-label="当前页面">
            <div class="stage-inner">
                <div id="page-header" class="page-header"></div>
                <div class="preview-wrap">
                    <div id="preview" class="preview"></div>
                </div>
                <div id="editor" class="editor"></div>
            </div>
        </section>
        <aside class="inspector" aria-label="页面文字和图片">
            <section id="text-card" class="card" hidden>
                <form id="text-form" class="text-form">
                    <div class="panel-header">
                        <h2>页面文字</h2>
                        <select id="text-type" aria-label="页面类型"><option>封面</option><option>内容</option><option>章节</option><option>总结</option></select>
                    </div>
                    <div class="field">
                        <label for="text-content">内容</label>
                        <textarea id="text-content" maxlength="4000" placeholder="这页要讲什么"></textarea>
                    </div>
                    <div class="field">
                        <label for="text-required">必须出现的文字</label>
                        <textarea id="text-required" maxlength="4000" placeholder="标题、数字或要点，会原样出现在图上"></textarea>
                    </div>
                    <div class="field">
                        <label for="text-style">本页风格</label>
                        <input id="text-style" maxlength="4000" placeholder="例如：左文右图，蓝色强调数字">
                    </div>
                    <button type="button" id="deck-style-link" class="link"></button>
                    <button type="submit" class="primary"><span data-icon="sparkle"></span><span>生成图片</span></button>
                </form>
            </section>
            <section class="card">
                <div class="panel-header">
                    <h2>图片 <span id="version-count" class="count"></span></h2>
                    <button id="upload-button" class="ghost" type="button" disabled><span data-icon="upload"></span><span>上传</span></button>
                    <input id="upload-input" type="file" accept="image/png,image/jpeg" hidden>
                </div>
                <div id="gallery" class="gallery"></div>
            </section>
        </aside>
    </main>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
        <form id="settings-form" class="settings-form">
            <div class="dialog-header">
                <h2 id="settings-title">本机绘图设置</h2>
                <button type="button" class="icon" data-close="settings-dialog" aria-label="关闭"><span data-icon="close"></span></button>
            </div>
            <div class="field">
                <label for="settings-key">RightAPI 密钥</label>
                <input id="settings-key" type="password" autocomplete="new-password" maxlength="1024" aria-describedby="settings-key-state">
                <small id="settings-key-state"></small>
            </div>
            <label id="settings-remove-row" hidden><input type="checkbox" id="settings-remove"> 移除本机保存的密钥</label>
            <div class="field">
                <label for="settings-model">绘图模型</label>
                <input id="settings-model" list="settings-models" maxlength="100" required>
                <datalist id="settings-models">
                    <option value="gpt-image-2"></option>
                    <option value="gpt-image-2.5-flare"></option>
                    <option value="gpt-image-2.5-sunburst"></option>
                    <option value="gpt-image-2.6-flare"></option>
                    <option value="gpt-image-2.6-sunburst"></option>
                </datalist>
            </div>
            <div class="field">
                <label for="settings-size">图片尺寸</label>
                <input id="settings-size" list="settings-sizes" maxlength="20" required>
                <datalist id="settings-sizes">
                    <option value="1536x864">16:9 宽屏</option>
                    <option value="2048x1152">16:9 高清</option>
                    <option value="1024x1024">正方形</option>
                    <option value="auto">自动</option>
                </datalist>
            </div>
            <div class="dialog-actions">
                <button type="button" class="ghost" data-close="settings-dialog">取消</button>
                <button type="submit" class="primary">保存设置</button>
            </div>
        </form>
    </dialog>
    <dialog id="style-dialog">
        <form id="style-form" class="settings-form">
            <div class="dialog-header">
                <h2>项目风格</h2>
                <button type="button" class="icon" data-close="style-dialog" aria-label="关闭"><span data-icon="close"></span></button>
            </div>
            <div class="field">
                <label for="deck-style">所有页面生成图片时共用的风格</label>
                <textarea id="deck-style" maxlength="4000" placeholder="例如：米白底、深绿色文字、留白充足"></textarea>
            </div>
            <div class="dialog-actions">
                <button type="button" class="ghost" data-close="style-dialog">取消</button>
                <button class="primary">保存风格</button>
            </div>
        </form>
    </dialog>
    <dialog id="trash-dialog">
        <div class="dialog-header">
            <h2>本项目回收站</h2>
            <button class="icon" data-close="trash-dialog" aria-label="关闭"><span data-icon="close"></span></button>
        </div>
        <div id="trash-list"></div>
    </dialog>
    <dialog id="name-dialog">
        <form id="name-form">
            <div class="dialog-header">
                <h2 id="name-heading"></h2>
                <button type="button" class="icon" data-close="name-dialog" aria-label="关闭"><span data-icon="close"></span></button>
            </div>
            <div class="field">
                <label for="name-input">名称</label>
                <input id="name-input" maxlength="100" required>
            </div>
            <div class="dialog-actions">
                <button type="button" class="ghost" data-close="name-dialog">取消</button>
                <button type="submit" class="primary">保存</button>
            </div>
        </form>
    </dialog>
    <dialog id="exports-dialog">
        <div class="dialog-header">
            <h2>导出</h2>
            <button class="icon" data-close="exports-dialog" aria-label="关闭"><span data-icon="close"></span></button>
        </div>
        <div class="export-actions">
            <button id="export-pptx" class="export-option"><span data-icon="slides"></span><strong>PPTX</strong><small>可在 PowerPoint 中编辑页序</small></button>
            <button id="export-pdf" class="export-option"><span data-icon="file"></span><strong>PDF</strong><small>适合分享和打印</small></button>
        </div>
        <h3 class="subheading">导出记录</h3>
        <div id="export-list"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
</body>
</html>
